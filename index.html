<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-A-Sketch</title>
    <link rel="stylesheet" href="./style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="header">
        <h1>Welome to Etch-A-Sketch</h1>
    </div>
    <div id="main">
        <div id="userMenuContainer">
            <div id="userMenu">
                <ul class="list">
                    <li class="listItem">Grid Size: <input id="gridSizeInput" type="number"></li>
                    <li class="listItem"><button id="resetBtn">Reset Grid</button></li>
                    <li class="listItem">Colour: <input type="color" id="color"></li>
                </ul>
            </div>
        </div>
        <div id="sketchContainer">
            <div id="sketchBox">

            </div>
        </div>
    </div>
    <div id="footer">
        <h4 id="copywright">Copyright @k1eran1</h4>
    </div>
</body>
</html>
